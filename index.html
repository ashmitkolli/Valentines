<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine?</title>

<style>
body {
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6eb;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 2rem;
  color: #ff4d6d;
}

button {
  font-size: 1.2rem;
  padding: 12px 25px;
  margin: 15px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
}

#yes {
  background-color: #ff4d6d;
  color: white;
}

#no {
  background-color: #aaa;
  position: absolute;
}

img {
  max-width: 250px;
  margin-top: 15px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="question">Will you be my Valentine? 💖</h1>

  <button id="yes">Yes</button>
  <button id="no">No</button>

  <div id="gifContainer"></div>
</div>

<script>
const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const gifContainer = document.getElementById("gifContainer");
const question = document.getElementById("question");

let noClicks = 0;

// --- Move NO button (mobile + desktop)
function moveNoButton() {
  const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
  const y = Math.random() * (window.innerHeight - noButton.offsetHeight);

  noButton.style.left = `${x}px`;
  noButton.style.top = `${y}px`;
}

// Hover for desktop
noButton.addEventListener("mouseover", moveNoButton);

// Tap for mobile
noButton.addEventListener("click", () => {
  noClicks++;

  moveNoButton();

  // After 5 clicks
  if (noClicks === 5) {
    question.innerHTML = "Okay that's getting suspicious 😭";

    gifContainer.innerHTML = `
      <img src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif">
    `;
  }

  // After 8 clicks
  if (noClicks === 8) {
    question.innerHTML = "Alright… just press YES once 😌💘";

    gifContainer.innerHTML = `
      <img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">
    `;
  }
});

// YES clicked
yesButton.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="text-align:center; padding:40px;">
      <h1 style="color:#ff4d6d;">
        YAYYYY 💕💘 <br> Best decision ever 😌
      </h1>
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif" style="max-width:300px;">
    </div>
  `;
});
</script>

</body>
</html>
