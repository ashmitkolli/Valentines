<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine?</title>

<style>

body {
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6eb;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  color: #ff4d6d;
  font-size: 2rem;
}

button {
  font-size: 1.2rem;
  padding: 14px 28px;
  margin: 15px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.25s ease;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #aaa;
  position: absolute;
}

img {
  max-width: 260px;
  margin-top: 15px;
  border-radius: 12px;
}

</style>
</head>

<body>

<div class="container">
  <h1 id="question">Will you be my Valentine? 💖</h1>

  <button id="yes">Yes</button>
  <button id="no">No</button>

  <div id="gifContainer"></div>
</div>

<script>

const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const question = document.getElementById("question");
const gifContainer = document.getElementById("gifContainer");

let noCount = 0;
let yesScale = 1;

function moveNo() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

document.addEventListener("pointerdown", (e) => {

  if (e.target === noBtn) {

    noCount++;

    yesScale += 0.12;
    yesBtn.style.transform = `scale(${yesScale})`;

    if (noCount === 5) {
      question.innerHTML = "Hmm… are you sure? 😭";
      gifContainer.innerHTML =
        '<img src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif">';
    }

    if (noCount === 8) {
      question.innerHTML = "Okay okay… just press YES once 😌💘";
      gifContainer.innerHTML =
        '<img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">';
    }

    requestAnimationFrame(moveNo);
  }
});

noBtn.addEventListener("mouseenter", moveNo);

yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="text-align:center;padding:40px;">
      <h1 style="color:#ff4d6d;">
        YAYYYY 💕💘 <br> Best decision ever 😌
      </h1>
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
    </div>
  `;
});

</script>

</body>
</html>
