<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine?</title>

<style>
body {
  height: 100vh;
  margin: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  background: #ffe6eb;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.container {
  text-align: center;
}

h1 {
  color: #ff4d6d;
  font-size: 2rem;
}

button {
  font-size: 1.2rem;
  padding: 14px 28px;
  margin: 15px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: transform 0.3s ease;
}

#yes {
  background: #ff4d6d;
  color: white;
}

#no {
  background: #aaa;
  position: absolute;
  touch-action: manipulation;
}

img {
  max-width: 260px;
  margin-top: 15px;
  border-radius: 12px;
}
</style>
</head>

<body>

<div class="container">
  <h1 id="question">Will you be my Valentine? 💖</h1>

  <button id="yes">Yes</button>
  <button id="no">No</button>

  <div id="gifContainer"></div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const gifContainer = document.getElementById("gifContainer");
const question = document.getElementById("question");

let noCount = 0;
let yesScale = 1;

// Move button safely
function moveNo() {
  const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
  const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";
}

// Reliable click handler
function handleNoClick(e) {
  e.preventDefault();

  noCount++;

  // Grow YES button
  yesScale += 0.12;
  yesBtn.style.transform = `scale(${yesScale})`;

  // ---- EXACTLY at 5 ----
  if (noCount === 5) {
    question.innerHTML = "Hmm… are you sure? 😭";

    gifContainer.innerHTML =
      '<img src="https://media.giphy.com/media/OPU6wzx8JrHna/giphy.gif">';
  }

  // ---- EXACTLY at 8 ----
  if (noCount === 8) {
    question.innerHTML = "Okay okay… just press YES once 😌💘";

    gifContainer.innerHTML =
      '<img src="https://media.giphy.com/media/3oriO0OEd9QIDdllqo/giphy.gif">';
  }

  // Move AFTER short delay (important fix)
  setTimeout(moveNo, 150);
}

// Works for mobile + desktop
noBtn.addEventListener("click", handleNoClick);

// Also dodge cursor on desktop hover
noBtn.addEventListener("mouseenter", moveNo);

// YES clicked
yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="text-align:center;padding:40px;">
      <h1 style="color:#ff4d6d;">
        YAYYYY 💕💘 <br> Best decision ever 😌
      </h1>
      <img src="https://media.giphy.com/media/MDJ9IbxxvDUQM/giphy.gif">
    </div>
  `;
});
</script>

</body>
</html>
