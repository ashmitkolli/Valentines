<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Valentine 💘</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .card {
      background: white;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 400px;
    }

    h1 {
      color: #ff4d6d;
      font-size: 2.3rem;
      margin-bottom: 10px;
    }

    p {
      color: #555;
      font-size: 1.1rem;
      min-height: 1.4em;
    }

    .buttons {
      margin-top: 30px;
    }

    button {
      font-size: 1.2rem;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    #yes {
      background: #ff4d6d;
      color: white;
    }

    #no {
      background: #ccc;
      color: #333;
      position: absolute;
    }

    .final {
      font-size: 2.2rem;
      color: #ff4d6d;
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <h1>Will you be my Valentine? 💖</h1>
    <p id="message"></p>

    <div class="buttons">
      <button id="yes">Yes 💕</button>
      <button id="no">No 😶</button>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");
    const card = document.getElementById("card");

    let noCount = 0;

    noBtn.addEventListener("mouseover", () => {
      noCount++;

      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);

      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;

      if (noCount === 5) {
        message.textContent = "😂 Okay wow, you’re REALLY trying to say no.";
      }

      if (noCount === 8) {
        message.textContent = "Alright alright… just click YES once 🙄💘";
      }
    });

    yesBtn.addEventListener("click", () => {
      card.innerHTML = `
        <div class="final">
          YAYYYYY 💕🥰<br>
          Best choice ever 💘
        </div>
      `;
    });
  </script>

</body>

          YAYYY 💕💘<br>
          Best decision ever 😌
        </h1>
      `;
    }
  </script>
</body>
</html>
